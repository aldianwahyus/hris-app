memory_limit=512M
max_execution_time=120
upload_max_filesize=10M
post_max_size=12M
date.timezone=Asia/Makassar

; Jangan mengumumkan versi PHP lewat header X-Powered-By — memudahkan
; penyerang menargetkan celah spesifik versi.
expose_php=Off

