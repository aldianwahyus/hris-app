server_tokens off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 12M;

    # Header keamanan — pelengkap WAF di perimeter (ARCH-001 §3), bukan
    # pengganti. HSTS tidak berefek di HTTP lokal (browser hanya
    # menghormatinya di HTTPS) — sengaja tetap disertakan agar aktif
    # otomatis begitu TLS dipasang di produksi, tanpa perlu berkas ini
    # diubah lagi.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # geolocation=(self) WAJIB, bukan sekadar diizinkan — layar Absensi
    # (Tahap 4) memakai navigator.geolocation dari origin yang sama.
    # API browser sensitif lain sengaja ditutup.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

    # CATATAN JUJUR: 'unsafe-inline' pada script-src/style-src masih
    # dibutuhkan karena seluruh tampilan saat ini memakai <style>/<script>
    # inline per halaman (belum ada berkas aset terpisah dengan nonce/hash).
    # CSP ini TIDAK menutup XSS berbasis skrip inline — yang ditutupnya:
    # domain eksternal sembarang untuk skrip/objek/bingkai, submit form ke
    # luar origin, dan penyisipan sebagai iframe situs lain. Perketat ke
    # nonce/hash saat styling dipindah ke aset terpisah.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
